<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script
    type="module"
    src="https://cdn.cubing.net/v0/js/cubing/twisty">
  </script>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    body {
      display: grid;
      place-items: center;
      background: transparent;
    }
  </style>
</head>
<body>
  <twisty-player id="player"></twisty-player>

  <script type="module">
    const params = new URLSearchParams(location.search);
    const player = document.querySelector("#player");

    player.puzzle = params.get("puzzle") ?? "3x3x3";
    player.alg = params.get("alg") ?? "";
    player.experimentalSetupAlg = params.get("setup") ?? "";
  </script>
</body>
</html>

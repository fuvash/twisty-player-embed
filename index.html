<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <script
    src="https://cdn.cubing.net/v0/js/cubing/twisty"
    type="module">
  </script>

  <style>
    html,
    body {
      margin: 0;
      background: transparent;
    }

    body {
      padding: 12px;
    }

    .twisty-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      overflow: hidden;
    }

    twisty-player {
      width: 256px;
      height: 316px;
    }

    twisty-alg-viewer {
      box-sizing: border-box;
      width: min(100%, 256px);
      padding: 8px;
      background: #aaaa;
    }

    twisty-alg-viewer.is-hidden {
      display: none;
    }
  </style>
</head>

<body>
  <main class="twisty-container">
    <twisty-player
      id="fto-player"
      puzzle="fto"
      style="
        width: 256px;
        height: 316px;
        margin: auto;
        background: #aaaa;
      "
      background="none"
      experimental-setup-alg="LBLv"
      alg="">
    </twisty-player>

    <twisty-alg-viewer
      id="fto-alg-viewer"
      for="fto-player">
    </twisty-alg-viewer>
  </main>

  <script type="module">
    await customElements.whenDefined("twisty-player");

    const params = new URLSearchParams(location.search);
    const player = document.querySelector("#fto-player");
    const algViewer = document.querySelector("#fto-alg-viewer");

    const alg = params.get("alg");
    const setup = params.get("setup");
    const mask = params.get("mask");
    const viewer = params.get("viewer");

    if (alg !== null) {
      player.alg = alg;
    }

    if (setup !== null) {
      player.experimentalSetupAlg = setup;
    }

    if (mask !== null) {
      player.experimentalStickeringMaskOrbits = mask;
    }

    const hiddenViewerValues = ["0", "false", "off"];

    if (viewer !== null && hiddenViewerValues.includes(viewer.toLowerCase())) {
      algViewer.classList.add("is-hidden");
    }
  </script>
</body>
</html>
